components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Savanna-Key
      description: Publishable key (read) or secret key (admin).
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        detail:
          type: string
      required:
        - type
        - title
        - status
      additionalProperties: {}
